<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Профиль — WorkShop Track</title>
    <link rel="stylesheet" href="css.css" />
</head>
<body>

<header>
    <h1>🔧 WorkShop Track</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="/gallery">Галерея</a>
        <a href="/group">Группа</a>
        <a href="/progress">Прогресс</a>
        <a href="/profile">Профиль</a>
    </nav>
</header>

<main>
    {{if .IsLoggedIn}}
        <section class="card">
            <h2>Профиль пользователя</h2>
            <p><strong>Логин:</strong> {{.Username}}</p>
            <p><strong>Email:</strong> {{.Email}}</p>
            <a href="/logout"><button>Выйти</button></a>
        </section>
    {{else}}
        <section class="card">
            <h2>Вход</h2>
            <form action="/login" method="POST">
                <input type="text" name="username" placeholder="Логин" required />
                <input type="password" name="passworduser" placeholder="Пароль" required />
                <button type="submit">Войти</button>
            </form>
        </section>

        <section class="card">
            <h2>Регистрация</h2>
            <form action="/register" method="POST">
                <input type="text" name="username" placeholder="Логин" required />
                <input type="email" name="Email" placeholder="Email" required />
                <input type="password" name="passworduser" placeholder="Пароль" required />
                <button type="submit">Зарегистрироваться</button>
            </form>
        </section>
</main>

</body>
</html>
