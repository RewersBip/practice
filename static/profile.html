<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация — WorkShopTrack</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="auth-card">
        <div class="logo">WorkShop<span>Track</span></div>
        <div class="subtitle">Учёт материалов в мастерской</div>

        <div class="tabs">
            <button id="loginTab" class="tab active">Вход</button>
            <button id="registerTab" class="tab">Регистрация</button>
            <div class="slider"></div>
        </div>

        <div id="loginForm" class="form-container">
            <input type="text" id="loginIdentifier" placeholder="Логин или email">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <button id="submitLogin" class="submit-btn">Войти</button>
            <div class="message" id="loginMessage"></div>
        </div>

        <div id="registerForm" class="form-container hidden">
            <input type="text" id="regLogin" placeholder="Логин">
            <input type="email" id="regEmail" placeholder="Email">
            <input type="password" id="regPassword" placeholder="Пароль">
            <input type="password" id="regPasswordRepeat" placeholder="Повторите пароль">
            <button id="submitRegister" class="submit-btn">Зарегистрироваться</button>
            <div class="message" id="registerMessage"></div>
        </div>

        <div class="back-link">
            <a href="index.html">← Вернуться на главную</a>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>
